# UFCL Mobile API — Nginx reverse proxy configuration
# ─────────────────────────────────────────────────────────────────────────────
# Deploy:   sudo cp tools/nginx.conf /etc/nginx/sites-available/ufcl-mobile
#           sudo ln -s /etc/nginx/sites-available/ufcl-mobile /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Requires: TLS certificate at /etc/ssl/ufcl/server.{crt,key}
#           Run: sudo bash tools/ssl-setup.sh
#
# Express binds to 127.0.0.1:3001 (set API_BIND_HOST=127.0.0.1 in .env).
# All external traffic enters on 443; HTTP redirects to HTTPS.
# ─────────────────────────────────────────────────────────────────────────────

upstream ufcl_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ────────────────────────────────────────────────────
server {
    listen 80;
    server_name 192.168.1.5;
    return 301 https://$host$request_uri;
}

# ── HTTPS — main server block ────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name 192.168.1.5;

    ssl_certificate     /etc/ssl/ufcl/server.crt;
    ssl_certificate_key /etc/ssl/ufcl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options         "DENY"        always;
    add_header X-Content-Type-Options  "nosniff"     always;
    add_header Referrer-Policy         "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Gzip compression for API JSON responses
    gzip on;
    gzip_types application/json text/plain text/html;
    gzip_min_length 1024;
    gzip_vary on;

    # ── APK downloads — large file, extended timeouts ────────────────────────
    # Range requests are forwarded intact for resumable downloads.
    location /downloads/ {
        proxy_pass              http://ufcl_api;
        proxy_http_version      1.1;
        proxy_set_header        Connection         "";
        proxy_set_header        Host               $host;
        proxy_set_header        X-Real-IP          $remote_addr;
        proxy_set_header        X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto  $scheme;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
        proxy_request_buffering off;
        proxy_buffering         off;
    }

    # ── Version metadata — small JSON, no special treatment ──────────────────
    location /version.json {
        proxy_pass             http://ufcl_api;
        proxy_http_version     1.1;
        proxy_set_header       Connection         "";
        proxy_set_header       Host               $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        proxy_read_timeout     10s;
        add_header             Cache-Control      "no-cache, no-store";
    }

    # ── All other requests — API + monitoring dashboard ───────────────────────
    location / {
        proxy_pass             http://ufcl_api;
        proxy_http_version     1.1;
        proxy_set_header       Connection         "";
        proxy_set_header       Host               $host;
        proxy_set_header       X-Real-IP          $remote_addr;
        proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto  $scheme;
        proxy_read_timeout     30s;
        proxy_send_timeout     30s;
        proxy_connect_timeout  5s;
    }

    # ── Block direct .env / log access if ever accidentally exposed ──────────
    location ~ /\.(env|log|git) {
        deny all;
        return 404;
    }
}
