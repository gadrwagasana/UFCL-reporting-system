# UFCL — logrotate configuration
# Deploy: sudo cp tools/logrotate.conf /etc/logrotate.d/ufcl
# Test:   sudo logrotate --debug /etc/logrotate.d/ufcl

# ── Structured API logs (JSON-lines, daily rotation) ─────────────────────────
# lib/logger.js already rotates by date; logrotate compresses and purges old files.
/opt/ufcl-api/logs/app-*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# ── PM2 stdout / stderr logs ──────────────────────────────────────────────────
/opt/ufcl-api/logs/pm2-*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

# ── Backup run log ────────────────────────────────────────────────────────────
/opt/ufcl-backups/backup.log {
    monthly
    rotate 12
    compress
    missingok
    notifempty
    copytruncate
}

# ── Backup cron log ───────────────────────────────────────────────────────────
/opt/ufcl-backups/cron.log {
    monthly
    rotate 6
    compress
    missingok
    notifempty
    copytruncate
}
