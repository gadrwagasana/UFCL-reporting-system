name: Mobile — Build & Release APK

# Triggers ONLY on a version tag push (e.g. git push origin v1.3.6)
# or a manual workflow_dispatch.  Pushes to master never trigger this.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name override (e.g. 1.0.2) — leave blank to use package.json'
        required: false
        default: ''
      mandatory:
        description: 'Force mandatory update (true / false)'
        required: false
        default: 'false'
      release_notes:
        description: 'Release notes — comma-separated (e.g. "Bug fixes,New harvest screen")'
        required: false
        default: 'Bug fixes,Performance improvements'

permissions:
  contents: write

jobs:
  # ── Job 1: Build APK on GitHub-hosted runner ─────────────────────────────────
  # Runs in the cloud (ubuntu-latest).  Produces the signed APK, checksums,
  # version metadata, and the GitHub Release.  Outputs are passed to job 2.
  build-apk:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    outputs:
      version-name: ${{ steps.ver.outputs.name }}
      version-code: ${{ steps.ver.outputs.code }}
      apk-filename: ${{ steps.ver.outputs.apk }}

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — needed for commit-count versionCode

      # ── 2. Java 17 ───────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # ── 4. npm install ───────────────────────────────────────────────────────
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      # ── 5. Decode keystore ───────────────────────────────────────────────────
      - name: Decode release keystore
        run: |
          mkdir -p mobile/release
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/release/ufcl-release.jks

      # ── 6. Write keystore.properties ─────────────────────────────────────────
      - name: Write keystore.properties
        run: |
          mkdir -p mobile/android
          cat > mobile/android/keystore.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../../release/ufcl-release.jks
          EOF

      # ── 7. Resolve version ───────────────────────────────────────────────────
      - name: Resolve version numbers
        id: ver
        working-directory: mobile
        run: |
          PKG=$(node -p "require('./package.json').version")
          VER="${{ github.event.inputs.version_name }}"
          [ -z "$VER" ] && VER="$PKG"
          CODE=$(git rev-list --count HEAD)
          DATE=$(date +%Y-%m-%d)
          echo "name=$VER"  >> $GITHUB_OUTPUT
          echo "code=$CODE" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=v$VER"  >> $GITHUB_OUTPUT
          echo "apk=UFCL-production-${VER}.apk" >> $GITHUB_OUTPUT

      # ── 8. Build release APK ─────────────────────────────────────────────────
      # EXPO_PUBLIC_API_URL points to the company server on port 3001 (HTTP, no nginx).
      - name: Build release APK
        working-directory: mobile/android
        env:
          CI: true
          APP_ENV: production
          APP_PACKAGE_ID: com.ufcl.mobile
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          EXPO_PUBLIC_API_URL: http://192.168.1.5:3001
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # ── 9. Locate & rename APK ───────────────────────────────────────────────
      - name: Locate and rename APK
        run: |
          SRC=$(find mobile/android -name "app-release.apk" | head -1)
          echo "Found: $SRC"
          mv "$SRC" "${{ steps.ver.outputs.apk }}"

      # ── 10. Compute checksums ─────────────────────────────────────────────────
      - name: Compute SHA-256 and MD5 checksums
        id: checksum
        run: |
          SHA256=$(sha256sum "${{ steps.ver.outputs.apk }}" | awk '{print $1}')
          MD5=$(md5sum      "${{ steps.ver.outputs.apk }}" | awk '{print $1}')
          echo "$SHA256" > apk.sha256
          echo "$MD5"    > apk.md5
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          echo "md5=$MD5"       >> $GITHUB_OUTPUT
          echo "SHA-256 : $SHA256"
          echo "MD5     : $MD5"

      # ── 11. Generate version metadata ─────────────────────────────────────────
      # version.json        → GitHub Release  (apkUrl = GitHub CDN)
      # version-server.json → company server  (apkUrl = LAN server HTTP:3001)
      - name: Generate version metadata
        run: |
          REPO="${{ github.repository }}"
          VER="${{ steps.ver.outputs.name }}"
          CODE="${{ steps.ver.outputs.code }}"
          DATE="${{ steps.ver.outputs.date }}"
          MANDATORY="${{ github.event.inputs.mandatory || 'false' }}"
          NOTES_RAW="${{ github.event.inputs.release_notes || 'Bug fixes,Performance improvements' }}"
          SHA256="${{ steps.checksum.outputs.sha256 }}"
          MD5="${{ steps.checksum.outputs.md5 }}"
          GH_APK_URL="https://github.com/${REPO}/releases/download/v${VER}/UFCL-production-${VER}.apk"
          SRV_APK_URL="http://192.168.1.5:3001/downloads/UFCL-production.apk"

          node -e "
            const fs = require('fs');
            const notes = process.env.NOTES.split(',').map(s=>s.trim()).filter(Boolean);
            const base = {
              version:     process.env.VER,
              versionCode: parseInt(process.env.CODE),
              releaseDate: process.env.DATE,
              mandatory:   process.env.MANDATORY === 'true',
              sha256:      process.env.SHA256,
              md5:         process.env.MD5,
              notes
            };
            fs.writeFileSync('version.json',
              JSON.stringify({ ...base, apkUrl: process.env.GH_APK_URL }, null, 2));
            fs.writeFileSync('version-server.json',
              JSON.stringify({ ...base, apkUrl: process.env.SRV_APK_URL }, null, 2));
            console.log('version.json :', JSON.parse(fs.readFileSync('version.json','utf8')));
            console.log('version-server.json:', JSON.parse(fs.readFileSync('version-server.json','utf8')));
          " VER="$VER" CODE="$CODE" DATE="$DATE" MANDATORY="$MANDATORY" \
            SHA256="$SHA256" MD5="$MD5" NOTES="$NOTES_RAW" \
            GH_APK_URL="$GH_APK_URL" SRV_APK_URL="$SRV_APK_URL"

      # ── 12. Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: UFCL Mobile ${{ steps.ver.outputs.tag }}
          body: |
            ## UFCL Mobile ${{ steps.ver.outputs.tag }}

            **Release Date:** ${{ steps.ver.outputs.date }}
            **Version Code:** ${{ steps.ver.outputs.code }}
            **Package:** com.ufcl.mobile
            **SHA-256:** ${{ steps.checksum.outputs.sha256 }}

            ### Release Notes
            ${{ github.event.inputs.release_notes || 'Bug fixes and performance improvements' }}

            ---
            The company server distributes this update automatically to all devices on the LAN.
            For manual installation, download `UFCL-production-${{ steps.ver.outputs.name }}.apk`.
          files: |
            ${{ steps.ver.outputs.apk }}
            version.json
            apk.sha256
            apk.md5
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 13. Upload artifacts for deploy job ──────────────────────────────────
      # The deploy-server job runs on the self-hosted runner (on 192.168.1.5)
      # and downloads these artifacts to copy them to the local update folder.
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mobile-release-${{ steps.ver.outputs.name }}
          path: |
            ${{ steps.ver.outputs.apk }}
            apk.sha256
            apk.md5
            version-server.json
          retention-days: 7

  # ── Job 2: Deploy to company server via self-hosted runner ────────────────────
  # This job runs ON 192.168.1.5 via the GitHub Actions self-hosted runner.
  # Because it runs locally on the server, it can:
  #   • copy files to the local filesystem
  #   • run npm install
  #   • start / restart PM2
  # No SSH over the internet is needed — the runner IS the server.
  #
  # Self-hosted runner setup (one-time, on the Windows server):
  #   GitHub → repo → Settings → Actions → Runners → New self-hosted runner
  #   Select Windows → follow the installer commands
  #   Label the runner:  ufcl-server
  #   Install as a Windows service so it starts on reboot
  deploy-server:
    name: Deploy to company server
    runs-on: [self-hosted, UFCL-server]
    needs: build-apk

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────────
      # Gives the runner access to mobile-api/ and db/ source code.
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Download APK + metadata from build job ─────────────────────────────
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-release-${{ needs.build-apk.outputs.version-name }}
          path: artifacts

      # ── 3. Write server .env ─────────────────────────────────────────────────
      # Required secrets (GitHub → repo → Settings → Secrets → Actions):
      #   PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD  — PostgreSQL connection
      #   JWT_SECRET     — token signing key
      #   DEPLOY_PATH    — absolute path on this server, e.g. C:\ufcl-api
      - name: Write server .env
        shell: powershell
        run: |
          $lines = @(
            "PGHOST=${{ secrets.PGHOST }}",
            "PGPORT=${{ secrets.PGPORT }}",
            "PGDATABASE=${{ secrets.PGDATABASE }}",
            "PGUSER=${{ secrets.PGUSER }}",
            "PGPASSWORD=${{ secrets.PGPASSWORD }}",
            "JWT_SECRET=${{ secrets.JWT_SECRET }}",
            "MOBILE_API_PORT=3001",
            "API_BIND_HOST=0.0.0.0",
            "UPDATES_DIR=${{ secrets.DEPLOY_PATH }}\updates"
          )
          $lines | Set-Content -Path ".env.server" -Encoding utf8NoBOM

      # ── 4. Create directory structure ─────────────────────────────────────────
      - name: Create deployment directories
        shell: powershell
        run: |
          New-Item -Force -ItemType Directory -Path "${{ secrets.DEPLOY_PATH }}\mobile-api"
          New-Item -Force -ItemType Directory -Path "${{ secrets.DEPLOY_PATH }}\db\services"
          New-Item -Force -ItemType Directory -Path "${{ secrets.DEPLOY_PATH }}\updates"

      # ── 5. Copy API server code ───────────────────────────────────────────────
      # mobile-api/node_modules is gitignored so only source files are copied.
      # db/ files are copied alongside mobile-api/ so relative imports resolve.
      - name: Deploy API server code
        shell: powershell
        run: |
          Copy-Item -Force -Recurse -Path "mobile-api\*" `
            -Destination "${{ secrets.DEPLOY_PATH }}\mobile-api\"
          Copy-Item -Force -Path "db\pool.js" `
            -Destination "${{ secrets.DEPLOY_PATH }}\db\pool.js"
          Copy-Item -Force -Path "db\migrate.js" `
            -Destination "${{ secrets.DEPLOY_PATH }}\db\migrate.js"
          Copy-Item -Force -Path "db\services\data.js" `
            -Destination "${{ secrets.DEPLOY_PATH }}\db\services\data.js"
          Copy-Item -Force -Path "db\services\auth.js" `
            -Destination "${{ secrets.DEPLOY_PATH }}\db\services\auth.js"
          # .env lives one level above mobile-api/ (where server.js looks for it)
          Copy-Item -Force -Path ".env.server" `
            -Destination "${{ secrets.DEPLOY_PATH }}\.env"

      # ── 6. Install API dependencies ───────────────────────────────────────────
      - name: Install API dependencies
        shell: powershell
        working-directory: ${{ secrets.DEPLOY_PATH }}\mobile-api
        run: npm install --omit=dev

      # ── 7. Deploy update artifacts ────────────────────────────────────────────
      # Rename the versioned APK to the fixed filename the Express route serves.
      # Replace version.json atomically via rename.
      - name: Deploy update artifacts
        shell: powershell
        run: |
          $dst = "${{ secrets.DEPLOY_PATH }}\updates"
          Move-Item -Force `
            "artifacts\${{ needs.build-apk.outputs.apk-filename }}" `
            "$dst\UFCL-production.apk"
          Copy-Item -Force "artifacts\apk.sha256"          "$dst\apk.sha256"
          Copy-Item -Force "artifacts\apk.md5"             "$dst\apk.md5"
          Move-Item -Force "artifacts\version-server.json" "$dst\version.json"

      # ── 8. Start or restart PM2 ───────────────────────────────────────────────
      - name: Restart API via PM2
        shell: powershell
        run: |
          $list = pm2 list 2>&1 | Out-String
          if ($list -match "ufcl-api") {
            pm2 restart ufcl-api --update-env
          } else {
            pm2 start "${{ secrets.DEPLOY_PATH }}\mobile-api\server.js" --name ufcl-api
          }
          pm2 save
          pm2 list
