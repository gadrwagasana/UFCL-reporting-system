# UFCL Mobile API — nginx reverse-proxy configuration
# =====================================================================
# Deployment: Windows, nginx 1.26+
# Place at:   C:\nginx\conf\conf.d\ufcl-mobile-api.conf
# Then add to C:\nginx\conf\nginx.conf inside the http{} block:
#   include conf.d/*.conf;
#
# Certificate paths assume mkcert output (see DEPLOYMENT_GUIDE §15).
# Change SERVER_IP to the actual static LAN IP (default: 192.168.1.5).
# =====================================================================

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────
server {
    listen      80;
    server_name 192.168.1.5;            # ← replace with your LAN IP

    # ACME challenge passthrough (if using Let's Encrypt in future)
    location /.well-known/acme-challenge/ { root C:/nginx/html; }

    # All other HTTP traffic gets redirected to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS reverse proxy ───────────────────────────────────────────────
server {
    listen      443 ssl;
    server_name 192.168.1.5;            # ← replace with your LAN IP

    # ── TLS certificates (generated by mkcert — see §15.2) ────────────
    # After running mkcert, the files will be named:
    #   192.168.1.5.pem  and  192.168.1.5-key.pem
    ssl_certificate     C:/nginx/certs/192.168.1.5.pem;
    ssl_certificate_key C:/nginx/certs/192.168.1.5-key.pem;

    # ── Modern TLS only ────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # ── HSTS (1 year — only enable after HTTPS is confirmed working) ───
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── Proxy settings ─────────────────────────────────────────────────
    # Express listens on 127.0.0.1:3001 (API_BIND_HOST=127.0.0.1)
    # All /api/* traffic is forwarded; everything else returns 404.
    location /api/ {
        proxy_pass             http://127.0.0.1:3001;
        proxy_http_version     1.1;

        # Forward real client IP so Express rate-limiting works per device
        proxy_set_header       Host              $host;
        proxy_set_header       X-Real-IP         $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto https;

        # Remove the Connection header to prevent keep-alive issues
        proxy_set_header       Connection        "";

        # Timeouts
        proxy_connect_timeout  5s;
        proxy_read_timeout     30s;
        proxy_send_timeout     10s;

        # Match Express body limit (512 kb)
        client_max_body_size   512k;
    }

    # Health check shortcut (no /api prefix needed for monitoring scripts)
    location = /health {
        proxy_pass http://127.0.0.1:3001/api/health;
    }

    # Block all other paths — this server exposes only the API
    location / {
        return 404;
    }
}
